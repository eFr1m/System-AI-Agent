
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: mcp-server
    ports:
      - "${MCP_SERVER_PORT}:9000"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=9000
    volumes:
      - .:/app:rw
    working_dir: /app
    depends_on:
      - ollama

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: system-agent
    ports:
      - "${AGENT_PORT}:8080"
    environment:
      - MCP_SERVER_HOST=mcp-server
      - MCP_SERVER_PORT=9000
      - OLLAMA_API_BASE=http://ollama:11434
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
    volumes:
      - .:/app:rw
      - agent-data:/app/data
    working_dir: /app
    depends_on:
      - mcp-server
      - ollama

volumes:
  ollama-data:
  agent-data:
